<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phasmophobia Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chatbot-container">
        <header class="chatbot-header">
            <h1>🎭 Phasmophobia Bot</h1>
            <p>Pregunta sobre fantasmas, equipos y estrategias</p>
        </header>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    <span class="bot-icon">🤖</span>
                    <p>¡Hola! Soy tu asistente de Phasmophobia. ¿En qué puedo ayudarte?</p>
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="Escribe tu pregunta sobre Phasmophobia..." maxlength="500">
                <button id="sendButton" class="send-btn">
                    <span class="send-icon">📤</span>
                </button>
            </div>
            <div class="loading-indicator" id="loadingIndicator" style="display: none;">
                <span class="loading-text">🔮 Consultando con los espíritus...</span>
            </div>
        </div>
    </div>

    <!-- Scripts de configuración -->
    <script src="env.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
